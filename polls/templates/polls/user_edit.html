{% extends 'polls/base.html' %}

{% block title %}Edit User: {{ user.username }}{% endblock %}

{% block content %}
    <h2 style="color: #333; text-align: center; margin-bottom: 20px;">Edit User: {{ user.username }}</h2>
    <form method="post" style="width: 400px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; background-color: #f9f9f9;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer;">Save Changes</button>
        <a href="{% url 'polls:user_list' %}" style="display: inline-block; margin-left: 10px; padding: 8px 12px; text-decoration: none; background-color: #6c757d; color: white; border-radius: 5px;">Cancel</a>
    </form>
{% endblock %}
