{% extends 'polls/base.html' %}

{% block title %}Confirm Delete User: {{ user.username }}{% endblock %}

{% block content %}
    <div style="text-align: center; padding: 30px;">
        <h2 style="color: #dc3545; margin-bottom: 20px;">Confirm Delete User: {{ user.username }}</h2>
        <p style="font-size: 1.1em; color: #555;">Are you sure you want to delete user "{{ user.username }}"?</p>
        <form method="post" style="display: inline-block; margin-right: 10px;">
            {% csrf_token %}
            <input type="hidden" name="confirm" value="yes">
            <button type="submit" style="background-color: #dc3545; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer;">Yes, Delete</button>
        </form>
        <a href="{% url 'polls:user_list' %}" style="background-color: #6c757d; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px;">Cancel</a>
    </div>
{% endblock %}
